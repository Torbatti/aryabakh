<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bfjit — Brainfuck to x64 JIT</title>
<style>
  :root{
    --bg: #0f1115;
    --panel: #15181e;
    --panel-2: #1b1f27;
    --line: #262b35;
    --text: #d8dce3;
    --dim: #737c8c;
    --accent: #e8a355;
    --accent-2: #5fb3a3;
    --err: #d9695f;
    --mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  #app{ max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }

  .hdr{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:6px; flex-wrap:wrap;}
  .hdr h1{ font-size:19px; font-weight:600; margin:0; letter-spacing:0.2px; color:#f0f2f5;}
  .hdr .tag{ font-size:12px; color: var(--accent-2); border:1px solid #2a3a37; background:#132321; padding:3px 8px; border-radius:3px; }
  .sub{ color: var(--dim); font-size:13px; line-height:1.6; margin: 0 0 22px; max-width: 74ch; }
  .sub code{ color: var(--accent-2); background: #10201e; padding: 1px 5px; border-radius:3px; font-size:12px; }

  .grid{ display:grid; grid-template-columns: 1.15fr 0.85fr; gap:16px; }
  @media (max-width: 780px){ .grid{ grid-template-columns: 1fr; } }

  .panel{ background: var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .panel-hd{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--line); background: var(--panel-2); }
  .panel-hd .t{ font-size:11px; letter-spacing:0.4px; color: var(--dim); }
  .panel-body{ padding:12px; }

  textarea{
    width:100%; resize:vertical; background: transparent; color:#eef0f4;
    border:none; outline:none; font-family:var(--mono); font-size:13px; line-height:1.6;
  }
  #src{ height:200px; }
  #stdin{ height:48px; }

  .row{ display:flex; align-items:center; gap:10px; padding: 10px 12px; border-top:1px solid var(--line); background: var(--panel-2); flex-wrap: wrap; }

  button{
    font-family: var(--mono); font-size:13px; cursor:pointer; border-radius:4px; border:1px solid transparent;
    padding:7px 14px; font-weight:600; transition: filter .12s ease;
  }
  button.primary{ background: var(--accent); color:#241606; }
  button.primary:hover{ filter: brightness(1.08); }
  button.primary:disabled{ opacity:.5; cursor:default; filter:none; }
  button.ghost{ background: transparent; color: var(--dim); border-color: var(--line); }
  button.ghost:hover{ color: var(--text); border-color:#3a4150; }

  .out{ height: 120px; overflow:auto; padding:12px; font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .out.err{ color: var(--err); }
  .out .cursor{ display:inline-block; width:7px; height:14px; background:var(--accent-2); vertical-align:-2px; animation: blink 1s step-start infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .stats{ padding:12px; display:grid; grid-template-columns: 1fr 1fr; gap:10px 16px; }
  .stat .k{ font-size:10.5px; letter-spacing:.5px; color:var(--dim); text-transform:uppercase; }
  .stat .v{ font-size:15px; color:#f0f2f5; margin-top:2px; }
  .stat .v.accent{ color: var(--accent); }
  .stat .v.accent2{ color: var(--accent-2); }

  .hex{ padding:12px; font-size:11px; line-height:1.65; color:#8b93a3; height:140px; overflow:auto; word-break:break-all; }

  .examples{ display:flex; gap:6px; flex-wrap:wrap; }
  .examples button{ padding:4px 10px; font-size:11.5px; font-weight:500; }

  .note{ font-size:12px; color:var(--dim); line-height:1.6; padding:12px; border-top:1px solid var(--line); }
  .note b{ color:var(--accent-2); font-weight:600; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#2a3040; border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.6';
import { useState, useRef } from 'https://esm.sh/preact@10.19.6/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

/* Brainfuck -> WebAssembly compiler.
 * A genuine x64 JIT means: emit machine code, mark it executable, jump to it.
 * A browser sandbox can't do that directly. WebAssembly is the legitimate
 * path to the same destination: this hand-writes real .wasm bytecode, and
 * the instant WebAssembly.instantiate() runs it, V8 JIT-compiles that
 * bytecode straight to native x64 machine code - the same pipeline that
 * JITs your JS. BF's [ ] brackets are already properly nested, so they map
 * directly onto WebAssembly's block/loop control flow with no jump patching.
 */

function uleb128(value) {
  const bytes = [];
  do {
    let byte = value & 0x7f;
    value >>>= 7;
    if (value !== 0) byte |= 0x80;
    bytes.push(byte);
  } while (value !== 0);
  return bytes;
}

function sleb128(value) {
  value = value | 0;
  const bytes = [];
  let more = true;
  while (more) {
    let byte = value & 0x7f;
    value >>= 7;
    if ((value === 0 && (byte & 0x40) === 0) || (value === -1 && (byte & 0x40) !== 0)) {
      more = false;
    } else {
      byte |= 0x80;
    }
    bytes.push(byte);
  }
  return bytes;
}

function strBytes(s) {
  const enc = new TextEncoder().encode(s);
  return [...uleb128(enc.length), ...enc];
}

function section(id, contentBytes) {
  return [id, ...uleb128(contentBytes.length), ...contentBytes];
}

function vec(items) {
  return [...uleb128(items.length), ...items.flat()];
}

const OP = {
  block: 0x02, loop: 0x03, br: 0x0c, br_if: 0x0d, call: 0x10, end: 0x0b,
  local_get: 0x20, local_set: 0x21,
  i32_load8_u: 0x2d, i32_store8: 0x3a,
  i32_const: 0x41,
  i32_eqz: 0x45,
  i32_add: 0x6a, i32_sub: 0x6b, i32_and: 0x71,
};

const TAPE_MASK = 0xffff;

function compileBrainfuckToWasm(source) {
  const ops = [];
  const loopStack = [];
  let instrCount = 0;

  const memarg = () => [0x00, 0x00];
  const emit = (...bytes) => { ops.push(...bytes); };

  for (const ch of source) {
    switch (ch) {
      case '>':
        emit(OP.local_get, 0, OP.i32_const, ...sleb128(1), OP.i32_add,
             OP.i32_const, ...sleb128(TAPE_MASK), OP.i32_and, OP.local_set, 0);
        instrCount++; break;
      case '<':
        emit(OP.local_get, 0, OP.i32_const, ...sleb128(1), OP.i32_sub,
             OP.i32_const, ...sleb128(TAPE_MASK), OP.i32_and, OP.local_set, 0);
        instrCount++; break;
      case '+':
        emit(OP.local_get, 0, OP.local_get, 0, OP.i32_load8_u, ...memarg(),
             OP.i32_const, ...sleb128(1), OP.i32_add, OP.i32_store8, ...memarg());
        instrCount++; break;
      case '-':
        emit(OP.local_get, 0, OP.local_get, 0, OP.i32_load8_u, ...memarg(),
             OP.i32_const, ...sleb128(1), OP.i32_sub, OP.i32_store8, ...memarg());
        instrCount++; break;
      case '.':
        emit(OP.local_get, 0, OP.i32_load8_u, ...memarg(), OP.call, 0);
        instrCount++; break;
      case ',':
        emit(OP.local_get, 0, OP.call, 1, OP.i32_store8, ...memarg());
        instrCount++; break;
      case '[':
        emit(OP.block, 0x40, OP.loop, 0x40,
             OP.local_get, 0, OP.i32_load8_u, ...memarg(), OP.i32_eqz, OP.br_if, 1);
        loopStack.push(true);
        instrCount++; break;
      case ']':
        if (!loopStack.length) throw new Error("unmatched ]");
        loopStack.pop();
        emit(OP.br, 0, OP.end, OP.end);
        instrCount++; break;
      default:
        break;
    }
  }
  if (loopStack.length) throw new Error("unmatched [");

  const typeSection = section(1, vec([
    [0x60, ...vec([0x7f]), ...vec([])],
    [0x60, ...vec([]), ...vec([0x7f])],
    [0x60, ...vec([]), ...vec([])],
  ]));

  const importSection = section(2, vec([
    [...strBytes('env'), ...strBytes('putchar'), 0x00, 0x00],
    [...strBytes('env'), ...strBytes('getchar'), 0x00, 0x01],
  ]));

  const functionSection = section(3, vec([[0x02]]));
  const memorySection = section(5, vec([[0x00, ...uleb128(1)]]));
  const exportSection = section(7, vec([
    [...strBytes('run'), 0x00, ...uleb128(2)],
    [...strBytes('memory'), 0x02, ...uleb128(0)],
  ]));

  const localDecls = vec([[...uleb128(1), 0x7f]]);
  const body = [...localDecls, ...ops, OP.end];
  const codeSection = section(10, vec([[...uleb128(body.length), ...body]]));

  const bytes = new Uint8Array([
    0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
    ...typeSection, ...importSection, ...functionSection,
    ...memorySection, ...exportSection, ...codeSection,
  ]);

  return { bytes, instrCount };
}

async function runCompiled(bytes, stdin, onChar) {
  let pos = 0;
  const importObject = {
    env: {
      putchar: (c) => onChar(c),
      getchar: () => (pos < stdin.length ? stdin.charCodeAt(pos++) : 0),
    },
  };
  const t0 = performance.now();
  const { instance } = await WebAssembly.instantiate(bytes, importObject);
  const t1 = performance.now();
  instance.exports.run();
  const t2 = performance.now();
  return { jitMs: t1 - t0, execMs: t2 - t1 };
}

function toHex(bytes) {
  const rows = [];
  for (let i = 0; i < bytes.length; i += 16) {
    const chunk = bytes.slice(i, i + 16);
    const off = i.toString(16).padStart(6, '0');
    const hex = Array.from(chunk).map((b) => b.toString(16).padStart(2, '0')).join(' ');
    rows.push(off + '  ' + hex);
  }
  return rows.join('\n');
}

const EXAMPLES = {
  'hello world': '++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.',
  'echo stdin': ',[.,]',
  'add two digits': ',>,[<+>-]<.',
  'shift char by one': ',+.',
};

function App() {
  const [src, setSrc] = useState(EXAMPLES['hello world']);
  const [stdin, setStdin] = useState('');
  const [output, setOutput] = useState('');
  const [errorMsg, setErrorMsg] = useState('');
  const [running, setRunning] = useState(false);
  const [stats, setStats] = useState(null);
  const [wasmBytes, setWasmBytes] = useState(null);
  const outRef = useRef(null);

  const onRun = async () => {
    setRunning(true);
    setErrorMsg('');
    setOutput('');
    setStats(null);
    let chars = [];
    try {
      const tCompileStart = performance.now();
      const { bytes, instrCount } = compileBrainfuckToWasm(src);
      const compileMs = performance.now() - tCompileStart;
      setWasmBytes(bytes);

      const { jitMs, execMs } = await runCompiled(bytes, stdin, (c) => {
        chars.push(String.fromCharCode(c));
      });

      setOutput(chars.join(''));
      setStats({
        instrCount,
        byteLen: bytes.length,
        compileMs,
        jitMs,
        execMs,
      });
    } catch (e) {
      setErrorMsg(String(e.message || e));
      setOutput(chars.join(''));
    } finally {
      setRunning(false);
    }
  };

  return html`
    <div class="hdr">
      <h1>bfjit <span style="color:var(--dim); font-weight:500;">— Brainfuck compiler</span></h1>
      <span class="tag">wasm -> native x64</span>
    </div>
    <p class="sub">
      Compiles Brainfuck straight to hand-assembled <code>.wasm</code> bytecode, no toolchain.
      The moment it's instantiated, the engine JIT-compiles it to real x64 machine code and runs it —
      the same route your JS itself takes to become native code.
    </p>

    <div class="grid">
      <div class="panel">
        <div class="panel-hd"><span class="t">SOURCE</span>
          <div class="examples">
            ${Object.keys(EXAMPLES).map((name) => html`
              <button class="ghost" onClick=${() => setSrc(EXAMPLES[name])}>${name}</button>
            `)}
          </div>
        </div>
        <div class="panel-body">
          <textarea id="src" spellcheck="false"
            value=${src}
            onInput=${(e) => setSrc(e.target.value)}
          ></textarea>
        </div>
        <div class="panel-hd" style="border-top:1px solid var(--line);"><span class="t">STDIN (for , )</span></div>
        <div class="panel-body">
          <textarea id="stdin" spellcheck="false"
            value=${stdin}
            onInput=${(e) => setStdin(e.target.value)}
            placeholder="input characters, read one at a time by ','"
          ></textarea>
        </div>
        <div class="row">
          <button class="primary" disabled=${running} onClick=${onRun}>
            ${running ? 'compiling…' : 'compile + run'}
          </button>
          <span style="font-size:11.5px; color:var(--dim);">${src.length} chars</span>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="panel">
          <div class="panel-hd"><span class="t">OUTPUT</span></div>
          <div class="out ${errorMsg ? 'err' : ''}" ref=${outRef}>${errorMsg ? ('compile error: ' + errorMsg) : (output || html`<span style="color:var(--dim);">run the program to see output here</span>`)}</div>
        </div>

        <div class="panel">
          <div class="panel-hd"><span class="t">JIT STATS</span></div>
          <div class="stats">
            <div class="stat"><div class="k">bf instructions</div><div class="v">${stats ? stats.instrCount : '—'}</div></div>
            <div class="stat"><div class="k">wasm module size</div><div class="v">${stats ? stats.byteLen + ' bytes' : '—'}</div></div>
            <div class="stat"><div class="k">compile to wasm</div><div class="v accent2">${stats ? stats.compileMs.toFixed(3) + ' ms' : '—'}</div></div>
            <div class="stat"><div class="k">wasm -> x64 jit</div><div class="v accent">${stats ? stats.jitMs.toFixed(3) + ' ms' : '—'}</div></div>
            <div class="stat" style="grid-column: 1 / -1;"><div class="k">native execution</div><div class="v accent">${stats ? stats.execMs.toFixed(3) + ' ms' : '—'}</div></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-hd"><span class="t">EMITTED WASM (hex)</span></div>
          <div class="hex">${wasmBytes ? toHex(wasmBytes) : 'compile a program to see its machine-readable bytecode'}</div>
        </div>
      </div>
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
